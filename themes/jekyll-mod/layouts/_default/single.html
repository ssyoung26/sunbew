{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
      {{ if .Date }}<time>{{ .Date.Format "Jan 2, 2006" }}</time>{{ end }}
      {{ with .Params.authors }} · {{ delimit . ", " }}{{ end }}
    </div>
    <div class="prose">{{ .Content }}</div>
  </article>
{{ end }}
