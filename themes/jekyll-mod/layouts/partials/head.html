<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ with .Site.Params.tagline }} — {{ . }}{{ end }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.tagline }}{{ end }}">
<link rel="stylesheet" href="{{ resources.Get "css/main.css" | resources.Minify | resources.Fingerprint | relURL }}">
<link rel="alternate" type="application/rss+xml" href="{{ .Site.BaseURL }}index.xml">
